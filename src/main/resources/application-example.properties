# OmniBid Backend - Cấu hình mẫu biến môi trường (Environment Variables)
# Sao chép các biến này vào file cấu hình môi trường hoặc biến hệ điều hành trước khi khởi chạy ứng dụng

# 1. Kết nối Cơ sở dữ liệu MySQL (Aiven Cloud hoặc Local)
DB_URL=jdbc:mysql://<host>:<port>/online_auction_db?sslMode=REQUIRED&serverTimezone=Asia/Ho_Chi_Minh
DB_USERNAME=avnadmin
DB_PASSWORD=your_database_password_here

# 2. Bảo mật JSON Web Token (JWT)
# Chuỗi bí mật tối thiểu 256-bit (Base64 hoặc Hex hoặc 32+ ký tự ngẫu nhiên)
JWT_SECRET=your_jwt_secret_key_minimum_256_bits_here

# 3. Cấu hình Frontend CORS (Tùy chọn)
FRONTEND_URL=http://localhost:3000
