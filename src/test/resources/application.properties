spring.application.name=omnibid-backend-test

# Datasource do Testcontainers (@ServiceConnection) cung cấp
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# Tắt Scheduler trong test; test gọi tick() thủ công
spring.task.scheduling.enabled=false

jwt.secret=TEST_ONLY_SECRET_KEY_12345678901234567890123456789012
jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:3000
app.payment.mock.allow-simulate-result=true
app.payment.mock.processing-delay-seconds=1