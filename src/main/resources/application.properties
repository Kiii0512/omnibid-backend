# ==========================================
# Cấu hình JPA / Hibernate
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Cấu hình JWT Security
# ==========================================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# ==========================================
# Cấu hình Lưu trữ & Upload Ảnh (Storage)
# ==========================================
# Mặc định dùng 'local' khi chạy dev trên máy, đổi thành 'cloudinary' khi deploy production
app.storage.type=local
app.storage.local.upload-dir=uploads
app.storage.local.base-url=http://localhost:8080/uploads

# Cấu hình Cloudinary (dùng khi app.storage.type=cloudinary)
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

# Giới hạn kích thước file upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB