spring.application.name=omnibid-backend-test

# Datasource do Testcontainers (@ServiceConnection) cung cấp
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=Asia/Ho_Chi_Minh

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Tắt Scheduler trong test; test gọi tick() thủ công
spring.task.scheduling.enabled=false

jwt.secret=TEST_ONLY_SECRET_KEY_12345678901234567890123456789012
jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:3000
app.payment.simulate-enabled=true
