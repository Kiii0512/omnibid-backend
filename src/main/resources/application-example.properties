# Sao chép thành src/main/resources/application-local.properties (đã nằm trong .gitignore)
# và kích hoạt profile: spring.profiles.active=dev,local

# ===== Database =====
spring.datasource.url=jdbc:mysql://<host>:<port>/omnibid_v4?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=<db_username>
spring.datasource.password=<db_password>

# ===== JWT (tối thiểu 32 byte cho HS256) =====
jwt.secret=<jwt_secret_at_least_32_bytes>

# ===== Cloudinary =====
cloudinary.cloud-name=<cloud_name>
cloudinary.api-key=<api_key>
cloudinary.api-secret=<api_secret>
cloudinary.folder=omnibid
