spring.application.name=omnibid-backend
server.port=8080

# DB
DB_URL=jdbc:mysql://localhost:3306/omnibid_v4?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
DB_USERNAME=root
DB_PASSWORD=your_password

# JWT
JWT_SECRET=your-256-bit-secret-key-at-least-32-characters-long

# Cloudinary
CLOUDINARY_CLOUD_NAME=your_cloud_name
CLOUDINARY_API_KEY=your_api_key
CLOUDINARY_API_SECRET=your_api_secret
