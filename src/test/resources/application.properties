spring.application.name=omnibid-backend-test

# Datasource do Testcontainers (@ServiceConnection) cung cấp, Flyway bật, ddl-auto=none, open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Tắt Scheduler trong test; test gọi tick() thủ công
spring.task.scheduling.enabled=false

jwt.secret=TEST_ONLY_SECRET_KEY_12345678901234567890123456789012
jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:3000

# Nghiệp vụ mặc định cho test
app.order.payment-deadline-hours=48
app.order.confirm-deadline-days=7
app.auction.min-duration-minutes=60
app.auction.max-duration-days=30
app.scheduler.interval-seconds=10
app.payment.simulate-enabled=true

# Login rate-limit
app.security.login.max-attempts=5
app.security.login.window-minutes=15
app.security.login.block-minutes=15

# Multipart
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
